<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f5b4c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Woot Scout" />
  <title>Woot Scout</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LIVE WOOT DEALS</div>
        <h1>Woot Scout</h1>
      </div>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh">↻</button>
    </header>

    <main>
      <section class="hero">
        <div>
          <span class="hero-kicker">Find the real steals</span>
          <h2>Big discounts.<br />Less digging.</h2>
          <p>Search live Woot inventory, rank markdowns, and surface the biggest percentage and dollar savings.</p>
        </div>
        <div class="hero-badge"><span id="dealCount">—</span><small>LIVE DEALS</small></div>
      </section>

      <section class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search Woot…" autocomplete="off" />
        <button id="clearSearch" class="clear-search" aria-label="Clear search">×</button>
      </section>

      <section class="chips" id="categoryChips" aria-label="Categories"></section>

      <section class="controls">
        <div class="control-group">
          <label for="sortSelect">Sort</label>
          <select id="sortSelect">
            <option value="percent">Biggest % off</option>
            <option value="dollars">Biggest $ savings</option>
            <option value="priceLow">Lowest price</option>
            <option value="priceHigh">Highest price</option>
            <option value="newest">Newest</option>
          </select>
        </div>
        <div class="control-group">
          <label for="discountSelect">Minimum discount</label>
          <select id="discountSelect">
            <option value="0">Any discount</option>
            <option value="30">30%+ off</option>
            <option value="50">50%+ off</option>
            <option value="60">60%+ off</option>
            <option value="70">70%+ off</option>
          </select>
        </div>
      </section>

      <section class="quick-grid">
        <button class="quick-card" data-preset="70"><strong>70%+</strong><span>Deep cuts</span></button>
        <button class="quick-card" data-preset="under25"><strong>&lt;$25</strong><span>Cheap finds</span></button>
        <button class="quick-card" data-preset="clearance"><strong>Clearance</strong><span>Last-call deals</span></button>
      </section>

      <section class="section-head">
        <div>
          <span class="eyebrow" id="resultsLabel">BIGGEST DISCOUNTS</span>
          <h3 id="resultsTitle">Top markdowns right now</h3>
        </div>
        <span id="resultCount" class="result-count">—</span>
      </section>

      <section id="status" class="status">Loading live Woot deals…</section>
      <section id="dealGrid" class="deal-grid" aria-live="polite"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-nav="deals"><span>🔥</span><small>Deals</small></button>
      <button class="nav-item" data-nav="search"><span>⌕</span><small>Search</small></button>
      <button class="nav-item" data-nav="saved"><span>♡</span><small>Saved</small></button>
    </nav>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
